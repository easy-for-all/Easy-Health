# THE source of truth for EasyHealth's orchestration events.
#
# An event with an entry here that is enabled and declares at least one channel
# IS an orchestration event: it is delivered to Make, always. There is no
# separate `orchestration:` flag — the entry itself is the declaration, and a
# second switch would just be a fourth place to drift from.
#
# MAKE_WEBHOOK_ALLOWED_EVENTS no longer narrows this list; it is legacy and can
# only ADD an uncatalogued event for smoke tests outside production. To turn one
# event off, set `enabled: false` below; to turn everything off,
# MAKE_WEBHOOK_ENABLED=false.
#
# What lives here is the technical routing: channels, the push descriptor
# (notification_type/route), the communication_type bucket and the engagement
# cap flag. Copy (title/body/emoji) and email HTML live in the Make scenario,
# NOT here. Known events with no entry resolve to an empty channel list and are
# never delivered as communication.
#
# Per-channel hard gates still apply per user: a user without email consent
# gets the email channel removed from delivery.channels, keeping push. See
# MakeWebhookEligibility.deliverable_channels and docs/event-orchestration.md.
#
# Conventions (keep the YAML lean):
#   enabled       : optional, defaults to true. Set `enabled: false` to keep the
#                   event configured but stop it from being delivered.
#   channels      : email | push. At least one is required when enabled.
#   communication_type: required editorial bucket (lifecycle | activation |
#                   progress | retention). Sent in delivery.communication_type.
#   template_key  : optional. Defaults to the event_name for email events; only
#                   set it when the Make email template key differs.
#   notification_type + route: required for push events.
#
# Push journey V1 push events: first_workout_not_started_2h,
# first_workout_not_started_24h, scheduled_workout_reminder_due,
# first_workout_completed, user_inactive_3_days, user_inactive_7_days.
#
# Every event in RelationshipEventTracker::EVENTS must be classified: either it
# has an entry here, or it is declared in config/non_communication_events.yml
# with the reason it never communicates. An event in neither file is reported as
# `uncatalogued` (critical) by the admin panel and fails the registry spec —
# that silence is what kept activation_workout_created out of Make.

# --- Email-only relationship journeys (orchestrated by Make) ---
user_created:
  channels:
    - email
  communication_type: lifecycle

subscription_created:
  channels:
    - email
  communication_type: lifecycle

checkout_started:
  channels:
    - email
  communication_type: lifecycle

trial_day_3:
  channels:
    - email
  communication_type: lifecycle

trial_day_6:
  channels:
    - email
  communication_type: lifecycle

trial_expired_without_subscription:
  channels:
    - email
  communication_type: lifecycle

workout_completed_partial:
  channels:
    - email
  communication_type: activation

never_created_workout:
  channels:
    - email
  communication_type: activation

churn_risk:
  channels:
    - email
  communication_type: retention

# first_workout_created / plan_created_but_not_used stay as email/analytics
# events but NO LONGER trigger push (V1 simplification).
first_workout_created:
  channels:
    - email
  communication_type: activation

plan_created_but_not_used:
  channels:
    - email
  communication_type: activation

# --- Push journey V1 ---

# Anchor of the activation journey, emitted the moment the plan is ready.
#
# This is a SIGNAL for Make, not a request to push. Reaching Make does NOT mean
# it should produce an immediate push: activation_reminder is an engagement
# category, so a push here consumes the 20h cooldown and would make
# first_workout_not_started_2h be skipped with cooldown_active two hours later.
# The Make scenario must receive and route this event WITHOUT an immediate push
# until that interference with the 2h/24h journey is decided deliberately.
activation_workout_created:
  channels:
    - push
  communication_type: activation
  notification_type: activation_reminder
  route: /workouts/ready
  engagement: true

first_workout_not_started_2h:
  channels:
    - push
  communication_type: activation
  notification_type: activation_reminder
  route: /workouts/ready
  engagement: true

first_workout_not_started_24h:
  channels:
    - push
  communication_type: activation
  notification_type: activation_reminder
  route: /workouts/ready
  engagement: true

scheduled_workout_reminder_due:
  channels:
    - push
  communication_type: activation
  notification_type: activation_reminder
  route: /workouts/ready
  engagement: true

first_workout_completed:
  channels:
    - push
  communication_type: progress
  notification_type: progress_update
  route: /workouts
  engagement: false

user_inactive_3_days:
  channels:
    - push
  communication_type: retention
  notification_type: workout_reminder
  route: /workouts/ready
  engagement: true

user_inactive_7_days:
  channels:
    - push
    - email
  communication_type: retention
  notification_type: workout_reminder
  route: /workouts/ready
  engagement: true
