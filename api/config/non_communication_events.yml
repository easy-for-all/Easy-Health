# Events from RelationshipEventTracker::EVENTS that must NEVER reach Make, each
# with the reason it does not communicate.
#
# This file is the other half of the catalog. communication_events.yml declares
# what IS orchestration; this one declares what deliberately is not. An event in
# NEITHER file is `uncatalogued`: reported as a critical warning by the admin
# panel and failing spec/services/communication_events_registry_spec.rb. That
# silence is exactly what kept activation_workout_created out of Make for
# months, so "no decision" is no longer a valid state.
#
# reason must be one of:
#   push_telemetry        : records what happened to a push we already sent.
#                           Feeding it back to Make would be an echo, not a fact.
#   product_analytics     : product/BI measurement. Its home is
#                           product_analytics_events, not a communication.
#   internal_audit        : security, moderation and admin trails. Never leaves
#                           the backend.
#   legacy_inactive       : in the registry but with no producer today. Do not
#                           reintroduce without a deliberate decision.
#   covered_by_other_event: the moment IS communicated, but through a different
#                           event that owns the contract. Naming which one is
#                           mandatory, in a comment.
#
# Adding an event here is a product decision, not a formality: it says the
# business accepts that Make never learns about this fact.

# --- Lifecycle facts already covered, or not communicated in V1 --------------
signup_completed:
  reason: covered_by_other_event # user_created owns the welcome contract
trial_started:
  reason: covered_by_other_event # user_created + subscription payloads carry trial state
trial_day_1:
  reason: legacy_inactive # journey starts at trial_day_3
trial_expired:
  reason: covered_by_other_event # trial_expired_without_subscription is the communicated one
subscription_renewed:
  reason: product_analytics
subscription_canceled:
  reason: product_analytics

# --- Workout activity (high volume, measured not communicated) --------------
