name: PR Check

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  # O build do Next é o que o Capacitor empacota. Sem ele aqui, um erro de build
  # só aparecia no deploy (ou, pior, no job Android, depois do deploy).
  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # TODO: remove continue-on-error once the pre-existing lint errors
      # (react-hooks/set-state-in-effect, React Compiler memoization) are fixed
      - run: npm run lint
        continue-on-error: true

  vitest:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # TODO: drop continue-on-error once the pre-existing failure in
      # analytics-installation.test.ts is fixed. Kept non-blocking so the job
      # can be added now and start reporting, rather than waiting.
      - run: npm test
        continue-on-error: true

  # A migration que derrubou produção em 04/08 estava sintaticamente perfeita e
  # passava em qualquer suíte: ela só falhava ao ENCONTRAR o banco. db:test:prepare
  # carrega schema.rb e nunca executa migration nenhuma, então nada no CI a
  # exercitava. Este job roda a fila inteira de migrations do zero, que é o mesmo
  # que o migration gate do deploy faz — só que antes do merge, e sem produção
  # do outro lado.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Run every migration from an empty database
        run: |
          set -euo pipefail
          bin/rails db:create
          bin/rails db:migrate

      # Nenhuma pode ficar "down" depois de um db:migrate limpo. Uma que fique é
      # uma migration que o Rails pulou — e que vai aparecer no boot em produção.
      - name: Assert no pending migration
        run: |
          set -euo pipefail
          bin/rails db:migrate:status
          if bin/rails db:migrate:status | grep -E '^\s+down\s'; then
            echo "::error::pending migration after a clean db:migrate"
            exit 1
          fi

      # Um db:migrate limpo tem que reproduzir exatamente o schema.rb versionado.
      # Divergência aqui é o sinal de que produção e o repositório discordam sobre
      # o formato do banco — que é a raiz do incidente de 04/08.
      - name: Assert schema.rb matches the migrations
        run: |
          set -euo pipefail
          if ! git diff --exit-code db/schema.rb; then
            echo "::error::db/schema.rb does not match the result of running the migrations"
            exit 1
          fi

  rspec:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      # No ruby-version input on purpose: setup-ruby reads api/.ruby-version
      # from working-directory, so the version stays defined in one place.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Prepare database
        run: bin/rails db:test:prepare

      # db/schema.rb is Ruby-format and cannot carry SQL views, so a database
      # built from the schema has none of the bi_observability_* views. The spec
      # suite also applies them in before(:suite); this makes the requirement
      # explicit and fails loudly here rather than inside a spec.
      # See docs/observability/BI_VIEWS.md.
      - name: Apply BI views
        run: bin/rails observability:bi_views:apply

      # Bloqueante, ao contrário da suíte completa abaixo. São os specs do
      # incidente de 04/08 (dois workout_plans ativos para o mesmo dono) e o
      # smoke de rotas do login Google. Um continue-on-error aqui devolveria o
      # bug para produção em silêncio, que é precisamente o que se está corrigindo.
      - name: Workout plan invariant and Google OAuth route specs
        run: |
          bundle exec rspec \
            spec/services/workout_plans/activate_plan_spec.rb \
            spec/migrations/add_installation_owner_to_workout_plans_spec.rb \
            spec/requests/google_oauth_routes_spec.rb

      # TODO: drop continue-on-error once the pre-existing failures
      # (personal/clients, coach/recommendations, block_load_context_service)
      # are fixed. The job reports today; it starts gating once the suite is green.
      - run: bundle exec rspec
        continue-on-error: true

  # Os quatro jobs abaixo vieram de api/.github/workflows/ci.yml, que o GitHub
  # nunca executou: Actions só lê .github/workflows/ da RAIZ do repositório, e
  # api/ não é submódulo. Brakeman, bundler-audit e RuboCop ficaram inertes desde
  # que foram criados. Todos são bloqueantes de propósito — cada um tem baseline
  # ou correção que os deixa verdes hoje.
  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      # --ensure-ignore-notes recusa entrada em config/brakeman.ignore sem
      # justificativa escrita; --ensure-no-obsolete-ignore-entries recusa entrada
      # que não corresponde mais a nenhum warning. Juntas, impedem que o ignore
      # vire depósito silencioso.
      - name: Scan for Rails security vulnerabilities
        run: |
          bundle exec brakeman --no-pager \
            --ensure-ignore-notes \
            --ensure-no-obsolete-ignore-entries

  bundler-audit:
    name: Bundler Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Scan gems for known CVEs
        run: bundle exec bundler-audit check --update

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('api/.ruby-version', 'api/.rubocop.yml', 'api/.rubocop_todo.yml', 'api/Gemfile.lock') }}
        with:
          path: api/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      # Bloqueante sobre o baseline de .rubocop_todo.yml: a dívida existente está
      # congelada lá, então só violação NOVA quebra o job.
      - name: Lint Ruby for consistent style
        run: bundle exec rubocop -f github

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Scan npm dependencies for known CVEs
        run: npm audit --audit-level=high
