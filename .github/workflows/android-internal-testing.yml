name: Android Build

# Dois gatilhos, um pipeline só.
#
# 1. pull_request tocando código compartilhado Web/Capacitor: compila e valida o
#    AAB do MESMO commit, sem publicar nada. Existe para o cenário "Web passa,
#    API passa, e o Android daquele commit não compila" ser descoberto antes do
#    merge, e não depois do deploy.
#
# 2. workflow_run do "Deploy EasyHealth": a release só avança quando o deploy da
#    API/Web terminou com sucesso — o que hoje inclui o migration gate e o health
#    check. É a forma mais simples que o GitHub Actions oferece de encadear dois
#    workflows separados, sem inventar arquitetura de CI.
#
# O push direto em main foi substituído pelo workflow_run: era ele que permitia
# publicar no Play em paralelo a um deploy que estava falhando.
on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/android-internal-testing.yml"
  workflow_run:
    workflows: ["Deploy EasyHealth"]
    types: [completed]
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Um deploy que falhou não gera release. workflow_dispatch e pull_request não
    # carregam workflow_run, e por isso passam direto.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_run roda no HEAD do branch por padrão, não no commit que
          # disparou o deploy. Sem isto o AAB publicado poderia ser de um commit
          # diferente do que acabou de ir para produção. Vazio nos outros
          # gatilhos, onde o checkout padrão já é o commit certo.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID is intentionally NOT needed here: the AAB
      # loads the live site (capacitor.config.ts server.url = https://easyhealth.art),
      # so native Google Sign-In uses the bundle built on the VPS, not this local build.
      - name: Build web
        working-directory: web
        run: npm run build

      - name: Add Android platform
        working-directory: web
        run: npx cap add android

      - name: Apply custom build config
        working-directory: web
        run: |
          cp android-config/app-build.gradle android/app/build.gradle
          # Root build.gradle carries the Firebase Crashlytics/Performance Gradle
          # plugin classpaths (applied in app/build.gradle only when
          # google-services.json is present). Must be deployed for those to load.
          cp android-config/build.gradle android/build.gradle
          cp android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-config/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          # Push notifications: manifest (POST_NOTIFICATIONS + FCM meta-data) and
          # notification icon/color resources.
          cp android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-config/MainActivity.java android/app/src/main/java/com/EasyHealth/myapp/MainActivity.java
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cp android-config/res/drawable/ic_stat_notification.xml android/app/src/main/res/drawable/ic_stat_notification.xml
          cp android-config/res/values/notification.xml android/app/src/main/res/values/notification.xml
          # Edge-to-edge: dark window background + splash/theme so the transparent
          # system bars reveal the EasyHealth dark surface instead of white bands.
          cp android-config/res/values/colors.xml android/app/src/main/res/values/colors.xml
          cp android-config/res/values/styles.xml android/app/src/main/res/values/styles.xml
          # Auto Backup rules referenced by AndroidManifest.xml. Without them the
          # build fails on the missing @xml resource — and, before them, a restored
          # backup handed a reinstalled app the previous installation_id.
          mkdir -p android/app/src/main/res/xml
          cp android-config/res/xml/backup_rules.xml android/app/src/main/res/xml/backup_rules.xml
          cp android-config/res/xml/data_extraction_rules.xml android/app/src/main/res/xml/data_extraction_rules.xml

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "❌ Secret GOOGLE_SERVICES_JSON_BASE64 não configurado"
            exit 1
          fi

          if ! echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode \
            > web/android/app/google-services.json; then
            echo "❌ GOOGLE_SERVICES_JSON_BASE64 precisa conter o google-services.json em base64"
            exit 1
          fi

      - name: Verify google-services.json
        run: |
          if [ ! -s web/android/app/google-services.json ]; then
            echo "❌ google-services.json está vazio ou ausente"
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');

          const file = 'web/android/app/google-services.json';
          const expectedPackageName = 'com.EasyHealth.myapp';
          let config;

          try {
            config = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (error) {
            console.error('❌ GOOGLE_SERVICES_JSON_BASE64 não decodificou para um JSON válido.');
            process.exit(1);
          }

          if (config.type === 'service_account' || config.private_key || config.client_email) {
            console.error('❌ GOOGLE_SERVICES_JSON_BASE64 parece ser uma Service Account.');
            console.error('Use o google-services.json do app Android no Firebase Console, não o JSON de Service Account.');
            process.exit(1);
          }

          const clients = Array.isArray(config.client) ? config.client : [];
          const androidClient = clients.find((client) => (
            client?.client_info?.android_client_info?.package_name === expectedPackageName
          ));

          const missingFields = [];
          if (!config.project_info || typeof config.project_info !== 'object') missingFields.push('project_info');
          if (!config.project_info?.project_number) missingFields.push('project_info.project_number');
          if (!config.project_info?.project_id) missingFields.push('project_info.project_id');
          if (!clients.length) missingFields.push('client[]');
          if (!androidClient) missingFields.push(`client[].client_info.android_client_info.package_name=${expectedPackageName}`);
          if (androidClient && !androidClient.client_info?.mobilesdk_app_id) {
            missingFields.push('client[].client_info.mobilesdk_app_id');
          }

          if (missingFields.length > 0) {
            console.error('❌ google-services.json não tem o formato esperado para Android/Firebase.');
            console.error(`Campos esperados ausentes: ${missingFields.join(', ')}`);
            process.exit(1);
          }
          NODE

          echo "✅ google-services.json Android válido ($(wc -c < web/android/app/google-services.json) bytes)"

      - name: Sync Capacitor
        working-directory: web
        run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/easyhealth-release.jks"

      - name: Make gradlew executable
        working-directory: web/android
        run: chmod +x gradlew

      - name: Verify Advertising ID permissions are absent
        working-directory: web/android
        run: |
          ./gradlew app:processReleaseMainManifest --no-daemon
          if grep -R -n \
            -e "com.google.android.gms.permission.AD_ID" \
            -e "android.permission.ACCESS_ADSERVICES_AD_ID" \
            -e "android.permission.ACCESS_ADSERVICES_ATTRIBUTION" \
            -e "android.permission.ACCESS_ADSERVICES_CUSTOM_AUDIENCE" \
            -e "android.permission.ACCESS_ADSERVICES_TOPICS" \
            app/build/intermediates/merged_manifest/release \
            app/build/intermediates/merged_manifests/release \
            app/build/intermediates/packaged_manifests/release 2>/dev/null; then
            echo "Advertising ID permission found in release manifest"
            exit 1
          fi

      - name: Verify androidbrowserhelper is absent
        working-directory: web/android
        run: |
          ./gradlew :app:dependencyInsight \
            --dependency androidbrowserhelper \
            --configuration releaseRuntimeClasspath \
            --no-daemon > /tmp/androidbrowserhelper-insight.txt
          cat /tmp/androidbrowserhelper-insight.txt
          if ! grep -q "No dependencies matching given input were found" /tmp/androidbrowserhelper-insight.txt; then
            echo "androidbrowserhelper still present in releaseRuntimeClasspath"
            exit 1
          fi

      - name: Build Release AAB
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/easyhealth-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew bundleRelease --no-daemon

      # Gradle pode terminar com exit 0 e não ter produzido o bundle (task
      # pulada, variante inesperada, output redirecionado). Sem esta checagem o
      # workflow fica verde e a ausência do artefato só aparece no passo de
      # upload, ou pior: um AAB antigo em cache é publicado no lugar.
      - name: Verify the AAB was produced
        working-directory: web/android
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$aab" ]; then
            echo "::error::expected AAB not found at web/android/$aab"
            ls -la app/build/outputs/bundle/release/ 2>/dev/null || echo "(bundle output directory does not exist)"
            exit 1
          fi

          # Um AAB é um zip; um arquivo truncado ou um placeholder de texto
          # passariam no teste de existência acima.
          unzip -l "$aab" > /dev/null
          echo "AAB OK ($(wc -c < "$aab") bytes, versionCode ${ANDROID_VERSION_CODE})"
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      # Smoke do login Google no lado nativo: o applicationId é o que amarra
      # keystore, google-services.json e o cliente OAuth Android no Google Cloud.
      # Se ele mudar, o login Google do app quebra e mais nada avisa.
      - name: Verify applicationId did not change
        working-directory: web/android
        run: |
          set -euo pipefail
          grep -q 'applicationId "com.EasyHealth.myapp"' app/build.gradle
          grep -q 'namespace = "com.EasyHealth.myapp"' app/build.gradle
          echo "applicationId OK: com.EasyHealth.myapp"

      # O plugin nativo rejeita scopes customizados no login() — foi essa a causa
      # do plugin_login_failed que já derrubou o login Google no Android uma vez.
      - name: Verify no custom Google scopes reached the native login
        working-directory: web
        run: |
          set -euo pipefail
          files="$(grep -rl "SocialLogin" src --include=*.ts --include=*.tsx || true)"
          [ -n "$files" ] || { echo "::error::no SocialLogin call site found"; exit 1; }

          # `scopes:` como chave de objeto, e não a palavra solta: o comentário
          # que explica por que ela não pode existir contém a palavra.
          if grep -nE '^[[:space:]]*scopes[[:space:]]*:' $files; then
            echo "::error::custom scopes passed to the native Google login — the plugin rejects them"
            exit 1
          fi
          echo "no custom scopes in the native Google login"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

  upload-to-play:
    name: Upload to Google Play Internal Testing
    runs-on: ubuntu-latest
    needs: build
    # Em pull_request o AAB é construído e validado, mas NÃO publicado: um PR
    # não é uma release. O track e os secrets seguem exatamente os que já
    # existiam — nada aqui muda para onde a release vai.
    if: github.event_name != 'pull_request'
    environment: internal-testing
    timeout-minutes: 15

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.EasyHealth.myapp
          releaseFiles: app-release.aab
          track: internal
          status: completed
