services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["./bin/rails", "server", "-p", "3001", "-b", "0.0.0.0"]
    ports:
      - "3001:3001"
    volumes:
      - storage_data:/rails/storage
      - ./api/public/exercise-images:/rails/public/exercise-images
    environment:
      RAILS_ENV: production
      # Marks a real deployed server. config/initializers/sentry.rb reports only
      # when this is present, so local containers never reach production Sentry.
      DEPLOY_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET}
      COMMUNICATION_DEFAULT_TIMEZONE: ${COMMUNICATION_DEFAULT_TIMEZONE:-America/Sao_Paulo}
      SCHEDULED_WORKOUT_REMINDER_ENABLED: ${SCHEDULED_WORKOUT_REMINDER_ENABLED:-true}
      SCHEDULED_WORKOUT_REMINDER_LEAD_MINUTES: ${SCHEDULED_WORKOUT_REMINDER_LEAD_MINUTES:-30}
      PUSH_QUIET_HOURS_ENABLED: ${PUSH_QUIET_HOURS_ENABLED:-true}
      PUSH_QUIET_HOURS_START: ${PUSH_QUIET_HOURS_START:-22:00}
      PUSH_QUIET_HOURS_END: ${PUSH_QUIET_HOURS_END:-07:00}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_INTERNAL_API_URL: ${NEXT_INTERNAL_API_URL:-http://api:3001}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID}
        # Build args, não environment: NEXT_PUBLIC_* é inlined no build. Passar
        # estas só na seção environment abaixo não teria efeito nenhum no bundle.
        NEXT_PUBLIC_ANDROID_POST_ONBOARDING_AB_ENABLED: ${NEXT_PUBLIC_ANDROID_POST_ONBOARDING_AB_ENABLED:-}
        NEXT_PUBLIC_ANDROID_POST_ONBOARDING_AB_MIN_BUILD: ${NEXT_PUBLIC_ANDROID_POST_ONBOARDING_AB_MIN_BUILD:-}
        NEXT_PUBLIC_ANDROID_POST_ONBOARDING_AB_STARTED_AT: ${NEXT_PUBLIC_ANDROID_POST_ONBOARDING_AB_STARTED_AT:-}
        # Default true (e não `:-` como as de cima): `:-` trata ausente e vazio
        # igual, e injetaria "" no build arg, sobrescrevendo o default do ARG e
        # derrubando o guard do Dockerfile. Assim, ausência no .env => true, e a
        # única forma de desligar é `NEXT_PUBLIC_FIREBASE_ANALYTICS_ENABLED=false`.
        NEXT_PUBLIC_FIREBASE_ANALYTICS_ENABLED: ${NEXT_PUBLIC_FIREBASE_ANALYTICS_ENABLED:-true}
        # Crashlytics é OUTRA decisão que Analytics: default false para não ligar
        # coleta por efeito colateral. Ligar exige a linha explícita no .env do
        # servidor E um rebuild — NEXT_PUBLIC_* é inlined no build.
        NEXT_PUBLIC_FIREBASE_CRASHLYTICS_ENABLED: ${NEXT_PUBLIC_FIREBASE_CRASHLYTICS_ENABLED:-false}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_INTERNAL_API_URL: ${NEXT_INTERNAL_API_URL:-http://api:3001}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    depends_on:
      - api
    env_file:
      - .env

volumes:
  pg_data:
  storage_data:
